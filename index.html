<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedal Schematic Study Kit</title>
<meta name="description" content="Flashcards, quizzes and a tap-to-find schematic for learning to read guitar pedal schematics.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedal Study">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12231c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Plan: pocket study tool styled like a pedal PCB. Light = drafting paper with a fine grid,
   dark = green soldermask with white silkscreen. Copper accent marks labels and the active choice.
   Layout: one column, phone first, tabs pinned to the bottom like an app. */
:root{
  --bg:#edf1ee;
  --grid:rgba(30,70,55,.07);
  --card:#fbfcfb;
  --ink:#14261f;
  --muted:#5a6b63;
  --line:#c8d3ce;
  --accent:#a95c1f;
  --accent-soft:rgba(169,92,31,.12);
  --good:#2c7a4b;
  --good-soft:rgba(44,122,75,.13);
  --bad:#b13838;
  --bad-soft:rgba(177,56,56,.12);
  --block-a:rgba(44,122,75,.10);
  --block-b:rgba(169,92,31,.10);
  --font-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1914; --grid:rgba(160,220,190,.05); --card:#12231c; --ink:#e8efea; --muted:#93a79d;
    --line:#263c32; --accent:#df9455; --accent-soft:rgba(223,148,85,.14); --good:#5cc085;
    --good-soft:rgba(92,192,133,.14); --bad:#ee7a7a; --bad-soft:rgba(238,122,122,.13);
    --block-a:rgba(92,192,133,.10); --block-b:rgba(223,148,85,.11); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1914; --grid:rgba(160,220,190,.05); --card:#12231c; --ink:#e8efea; --muted:#93a79d;
  --line:#263c32; --accent:#df9455; --accent-soft:rgba(223,148,85,.14); --good:#5cc085;
  --good-soft:rgba(92,192,133,.14); --bad:#ee7a7a; --bad-soft:rgba(238,122,122,.13);
  --block-a:rgba(92,192,133,.10); --block-b:rgba(223,148,85,.11); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:680px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px}
header.top h1{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
header.top h1 span{color:var(--accent)}
header.top .sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance}
.view{display:none}
.view.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 14px var(--font-body);border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,.card:focus-visible,nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--muted);margin:2px 0 12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
/* flashcard */
.card{position:relative;height:430px;perspective:1200px;cursor:pointer;border-radius:16px}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:12px;right:14px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.q{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.25;padding-right:48px}
.fig{flex:1;display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--ink)}
.fig svg{width:100%;max-width:320px;max-height:210px}
.back .fig{flex:none;min-height:0}
.back .fig svg{max-height:150px}
.big{font-family:var(--font-mono);font-weight:600;font-size:56px;letter-spacing:.02em;color:var(--ink)}
.tap{text-align:center;font-size:14px;color:var(--muted)}
.ans{font-size:24px;margin:0;line-height:1.2}
.refchip{display:inline-block;font-family:var(--font-mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-right:6px}
.detail{margin:0;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{font:700 16px var(--font-body);padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.again{border-color:var(--bad);color:var(--bad)}
.btn.got{border-color:var(--good);background:var(--good);color:var(--card)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--card)}
.btn.ghost{background:transparent}
.btn[hidden]{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.done{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.done h2{margin:0 0 6px}
/* quiz */
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:600 16px var(--font-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0}
.score{font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--accent);margin:0}
.missed{text-align:left;margin:10px 0 0;padding-left:20px}
/* find it */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{font:700 15px var(--font-body);border:0;background:transparent;color:var(--ink);padding:9px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.prompt{background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;font-family:var(--font-display);font-weight:600;font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.prompt small{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
.schwrap{overflow-x:auto;margin:10px -16px 0;padding:0 16px;-webkit-overflow-scrolling:touch}
.schwrap svg{display:block;min-width:700px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.info{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.info h3{margin:0 0 4px;font-size:19px}
.info p{margin:6px 0 0}
.info.good{border-color:var(--good)}
.info.bad{border-color:var(--bad)}
.tag{display:inline-block;font:600 12px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* which end guide */
.gsec{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.gsec h2{margin:0 0 4px;font-size:21px}
.gsec > p{margin:4px 0 10px;color:var(--muted)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:8px 0 10px}
figure{margin:0;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg)}
figure svg{width:100%;max-width:220px;max-height:150px;color:var(--ink)}
figcaption{font-size:14px;text-align:center;font-weight:700}
.gsec ul{margin:0;padding-left:20px}
.gsec li{margin:4px 0}
.gsec b{color:var(--accent)}
/* svg drawing */
.sym line,.sym path,.sym rect,.sym circle,.sym polyline{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sym .fill{fill:currentColor}
.sym .fillA{fill:var(--accent);stroke:var(--accent)}
.sym .dash{stroke-dasharray:3 3}
.sym .thick{stroke-width:3.5}
.sym .body{stroke-width:1.4;opacity:.55}
.sym text{stroke:none;font-family:var(--font-mono)}
.sym .lbl{fill:var(--accent);font-size:6.6px;font-weight:600}
.sym .pin{fill:var(--accent);font-size:9px;font-weight:600}
.sym .pinN{fill:currentColor;font-size:7px;font-weight:600}
.sym .pm{fill:currentColor;font-size:11px;font-weight:600}
.sym .pmS{fill:currentColor;font-size:7.5px;font-weight:600}
.sym .inv{fill:var(--card);font-size:9px;font-weight:600}
.sch .w,.sch line,.sch path,.sch rect,.sch circle{stroke-width:1.7}
.sch .ref{fill:currentColor;font-size:10.5px;font-weight:600}
.sch .val{fill:var(--muted);font-size:9.5px;font-weight:500}
.sch .dot{fill:currentColor;stroke:none}
.sch .blk{stroke:none}
.sch .blkA{fill:var(--block-a)}
.sch .blkB{fill:var(--block-b)}
.sch .blkname{fill:var(--accent);font-size:9.5px;font-weight:600;letter-spacing:.06em}
.sch .blocks{display:none}
.sch.showblocks .blocks{display:inline}
.sch .hit{fill:transparent;stroke:none;cursor:pointer}
.sch .sel{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:4 3}
.sch .sel.good{stroke:var(--good);stroke-dasharray:none}
.sch .sel.bad{stroke:var(--bad)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:680px}
nav.tabs button{font:700 13px var(--font-body);background:none;border:0;color:var(--muted);padding:9px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:26px;height:20px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}
@media (max-width:400px){.big{font-size:46px}.card{height:450px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Pedal Schematic <span>Study Kit</span></h1>
    <div class="sub" id="knownTotal"></div>
  </header>

  <section class="view" id="v-cards" aria-label="Flashcards">
    <div class="chips" id="deckChips" role="group" aria-label="Choose a deck"></div>
    <div class="progress"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
    <div id="cardZone"></div>
  </section>

  <section class="view" id="v-quiz" aria-label="Quiz">
    <div class="chips" id="quizChips" role="group" aria-label="Choose a quiz deck"></div>
    <div id="quizZone"></div>
  </section>

  <section class="view" id="v-find" aria-label="Find it on a schematic">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mHunt" aria-pressed="true">Hunt</button>
        <button id="mExplore" aria-pressed="false">Explore</button>
      </div>
      <label class="toggle" for="showBlocks"><input type="checkbox" id="showBlocks"> Show sections</label>
    </div>
    <div class="prompt" id="huntPrompt"></div>
    <div class="schwrap" id="schWrap"></div>
    <p class="hint">An example overdrive circuit. Scroll sideways on a phone. The bypass footswitch is left out to keep it simple.</p>
    <div class="info" id="findInfo"></div>
  </section>

  <section class="view" id="v-pins" aria-label="Which end is which"></section>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="cards"><svg viewBox="0 0 26 20" class="sym"><rect x="5" y="2" width="16" height="16" rx="2"/><path d="M9 10 H17"/></svg>Cards</button>
    <button data-tab="quiz"><svg viewBox="0 0 26 20" class="sym"><path d="M5 10 L10 15 L21 4"/></svg>Quiz</button>
    <button data-tab="find"><svg viewBox="0 0 26 20" class="sym"><path d="M2 10 H6 L8 6 L11 14 L14 6 L17 14 L19 10 H24"/></svg>Find it</button>
    <button data-tab="pins"><svg viewBox="0 0 26 20" class="sym"><path d="M3 10 H8"/><path d="M8 4 L8 16 L18 10 Z"/><path d="M18 4 V16"/><path d="M18 10 H23"/></svg>Which end</button>
  </div>
</nav>

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
const KEY='pedal-study-v2';
let store={known:{},best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.known)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

/* ---------- svg helpers ---------- */
const L=(a,b,c,d,cls)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${cls?` class="${cls}"`:''}/>`;
const P=(d,cls)=>`<path d="${d}"${cls?` class="${cls}"`:''}/>`;
const R=(x,y,w,h,cls,rx)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${rx?` rx="${rx}"`:''}${cls?` class="${cls}"`:''}/>`;
const C=(x,y,r,cls)=>`<circle cx="${x}" cy="${y}" r="${r}"${cls?` class="${cls}"`:''}/>`;
const T=(x,y,s,a,cls)=>`<text x="${x}" y="${y}" text-anchor="${a==='start'||a==='end'?a:'middle'}" class="${cls||'lbl'}">${s}</text>`;
const head=(x,y,ang)=>`<path class="fill" style="stroke-width:1" d="M0,0 L-7,-3.4 L-7,3.4 Z" transform="translate(${x},${y}) rotate(${ang})"/>`;
const arrow=(a,b,c,d)=>L(a,b,c,d)+head(c,d,Math.atan2(d-b,c-a)*180/Math.PI);
const G=(s,x,y,rot,mirror)=>`<g transform="translate(${x},${y})${rot?` rotate(${rot})`:''}${mirror?' scale(-1,1)':''}">${s}</g>`;
const svg=(vb,inner,cls)=>`<svg viewBox="${vb}" class="sym${cls?' '+cls:''}" aria-hidden="true">${inner}</svg>`;

const zig='M0,0 H12 L15,-6 L21,6 L27,-6 L33,6 L39,-6 L45,6 L48,0 H60';
const ground=(x,y)=>L(x,y,x,y+10)+L(x-10,y+10,x+10,y+10)+L(x-6,y+14,x+6,y+14)+L(x-2,y+18,x+2,y+18);
const rail=(x,y,t)=>L(x,y,x,y-12)+L(x-9,y-12,x+9,y-12)+T(x,y-17,t,'middle','pmS');
function flag(x,y,t,dir){
  const w=t.length*6+12;
  if(dir==='left') return R(x-w,y-8,w,16,'',3)+T(x-w/2,y+3,t,'middle','pmS');
  if(dir==='down') return R(x-w/2,y,w,16,'',3)+T(x,y+11,t,'middle','pmS');
  return R(x,y-8,w,16,'',3)+T(x+w/2,y+3,t,'middle','pmS');
}
const diodeBody=bar=>L(0,0,20,0)+P('M20,-10 L20,10 L40,0 Z')+bar+L(40,0,60,0);
const BAR={plain:L(40,-10,40,10),zener:P('M36,-13 L40,-10 L40,10 L44,13'),schottky:P('M45,-6 L45,-10 L40,-10 L40,10 L35,10 L35,6')};
const diodeLbl=T(8,22,'anode +')+T(52,22,'cathode −');
const spdt=L(0,0,13,0)+C(15,0,2)+L(16.5,-1,42,-11)+C(45,-12,2)+C(45,12,2)+L(47,-12,60,-12)+L(47,12,60,12);
const opBody=(plusTop)=>P('M0,-28 L0,28 L50,0 Z')+L(-14,-14,0,-14)+L(-14,14,0,14)+L(50,0,64,0)+
  T(7,-10,plusTop?'+':'−','middle','pm')+T(7,18,plusTop?'−':'+','middle','pm');
const jackMono=R(0,-14,7,28,'fill')+P('M48,-10 H18 L14,-3 L10,-10')+L(7,12,48,12);

const SYM={
  resUS:{vb:'-8 -26 76 44',f:()=>P(zig)},
  resBox:{vb:'-8 -26 76 44',f:()=>L(0,0,14,0)+R(14,-6,32,12)+L(46,0,60,0)},
  cap:{vb:'-8 -26 76 44',f:()=>L(0,0,26,0)+L(26,-12,26,12)+L(34,-12,34,12)+L(34,0,60,0)},
  ecap:{vb:'-12 -28 84 58',f:lb=>L(0,0,26,0)+L(26,-12,26,12)+P('M37,-12 Q31,0 37,12')+L(33.5,0,60,0)+T(18,-7,'+','middle','pm')+(lb?T(12,24,'+ side')+T(50,24,'− side'):'')},
  pot:{vb:'-8 -36 82 56',f:lb=>P(zig)+arrow(30,-30,30,-9)+(lb?T(2,14,'1','middle','pin')+T(58,14,'3','middle','pin')+T(35,-25,'2 wiper','start','pin'):'')},
  trim:{vb:'-8 -32 76 50',f:()=>P(zig)+L(30,-26,30,-10)+L(24,-10,36,-10)},
  diode:{vb:'-14 -28 90 58',f:lb=>diodeBody(BAR.plain)+(lb?diodeLbl:'')},
  zener:{vb:'-14 -28 90 58',f:lb=>diodeBody(BAR.zener)+(lb?diodeLbl:'')},
  schottky:{vb:'-14 -28 90 58',f:lb=>diodeBody(BAR.schottky)+(lb?diodeLbl:'')},
  led:{vb:'-14 -32 90 62',f:lb=>diodeBody(BAR.plain)+arrow(29,-12,37,-24)+arrow(37,-9,45,-21)+(lb?diodeLbl:'')},
  ldr:{vb:'-8 -40 76 64',f:()=>L(0,0,14,0)+R(14,-6,32,12)+L(46,0,60,0)+C(30,0,20,'body')+arrow(4,-34,16,-13)+arrow(15,-38,27,-15)},
  vactrol:{vb:'-12 -32 88 64',f:()=>R(-4,-27,70,54,'dash',4)+P('M6,-10 L22,-10 L14,4 Z')+L(6,4,22,4)+L(14,-26,14,-10)+L(14,4,14,26)+R(44,-12,12,24)+L(50,-26,50,-12)+L(50,12,50,26)+arrow(24,-5,39,-5)+arrow(24,5,39,5)},

const $=(s,r)=>(r||document).querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const byId=id=>{const k=id.split(':')[0];return DECKS[k].cards.find(c=>c.id===id);};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function frontFig(c){return c.big?`<div class="big">${esc(c.big)}</div>`:(c.fig?c.fig():'');}
function knownCount(k){return DECKS[k].cards.filter(c=>store.known[c.id]).length;}
function updateTotal(){let n=0,t=0;ORDER.forEach(k=>{n+=knownCount(k);t+=DECKS[k].cards.length;});$('#knownTotal').textContent=n+'/'+t+' known';}

/* ---------- flashcards ---------- */
const fc={deck:'symbols',queue:[],cur:null,flipped:false};
function chipsHTML(active,attr){return ORDER.map(k=>`<button class="chip" ${attr}="${k}" aria-pressed="${k===active}">${DECKS[k].name}</button>`).join('');}
function drawDeckChips(){$('#deckChips').innerHTML=chipsHTML(fc.deck,'data-deck');}
function drawProgress(){const n=knownCount(fc.deck),t=DECKS[fc.deck].cards.length;$('#progTxt').textContent=`${n}/${t} known`;$('#progBar').style.width=(100*n/t)+'%';updateTotal();}
function startDeck(k,all){
  fc.deck=k;drawDeckChips();
  const cards=DECKS[k].cards.filter(c=>all||!store.known[c.id]);
  fc.queue=shuffle(cards.map(c=>c.id));nextCard();
}
function nextCard(){
  drawProgress();fc.flipped=false;
  if(!fc.queue.length){fc.cur=null;
    $('#cardZone').innerHTML=`<div class="done"><h2>Deck done</h2><p>You marked every card in <b>${DECKS[fc.deck].name}</b> as known.</p>
    <div class="row"><button class="btn primary" id="redo">Go through them again</button><button class="btn ghost" id="reset">Reset this deck</button></div></div>`;
    return;}
  fc.cur=byId(fc.queue.shift());const c=fc.cur;
  const left=fc.queue.length+1;
  $('#cardZone').innerHTML=`
  <div class="card" id="card" tabindex="0" role="button" aria-label="Card. Tap to flip.">
    <div class="inner">
      <div class="face front"><span class="corner">${left} left</span><div class="q">${esc(c.q)}</div><div class="fig">${frontFig(c)}</div><div class="tap">Tap to flip</div></div>
      <div class="face back">${c.back?`<div class="fig">${c.back()}</div>`:(c.big?`<div class="big" style="font-size:30px">${esc(c.big)}</div>`:'')}
        <h2 class="ans">${esc(c.a)}</h2>${c.ref?`<div><span class="refchip">${esc(c.ref)}</span></div>`:''}<p class="detail">${esc(c.d||'')}</p></div>
    </div>
  </div>
  <div class="actions"><button class="btn again" id="again" hidden>Again</button><button class="btn got" id="got" hidden>Got it</button></div>`;
}
function flip(){const el=$('#card');if(!el)return;fc.flipped=!fc.flipped;el.classList.toggle('flipped',fc.flipped);$('#again').hidden=$('#got').hidden=false;}
$('#v-cards').addEventListener('click',e=>{
  const t=e.target.closest('button,.card');if(!t)return;
  if(t.dataset.deck){startDeck(t.dataset.deck);}
  else if(t.id==='card')flip();
  else if(t.id==='got'){store.known[fc.cur.id]=1;save();nextCard();}
  else if(t.id==='again'){fc.queue.splice(Math.min(3,fc.queue.length),0,fc.cur.id);nextCard();}
  else if(t.id==='redo')startDeck(fc.deck,true);
  else if(t.id==='reset'){DECKS[fc.deck].cards.forEach(c=>delete store.known[c.id]);save();startDeck(fc.deck);}
});
$('#v-cards').addEventListener('keydown',e=>{if(e.target.id==='card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flip();}});

/* ---------- quiz ---------- */
const qz={deck:'symbols',items:[],i:0,score:0,missed:[],answered:false};
function startQuiz(k){
  qz.deck=k;$('#quizChips').innerHTML=chipsHTML(k,'data-qdeck');
  qz.items=shuffle(DECKS[k].cards).slice(0,10);qz.i=0;qz.score=0;qz.missed=[];drawQ();
}
function optionsFor(c){
  let wrong;
  if(c.o)wrong=c.o.slice(0,3);
  else{const pool=DECKS[c.deck].cards.filter(x=>x.a!==c.a).map(x=>x.a);
    const pri=shuffle((c.alt||[]).filter(a=>pool.includes(a)));
    wrong=[...new Set(pri.concat(shuffle(pool)))].slice(0,3);}
  return shuffle(wrong.concat(c.a));
}
function drawQ(){
  const z=$('#quizZone');qz.answered=false;
  if(qz.i>=qz.items.length){
    const best=Math.max(store.best[qz.deck]||0,qz.score);store.best[qz.deck]=best;save();
    z.innerHTML=`<div class="done"><p class="tag">${DECKS[qz.deck].name}</p><p class="score">${qz.score}/${qz.items.length}</p><p>Best so far: ${best}/10</p>
    ${qz.missed.length?`<p style="margin-bottom:0"><b>Review these:</b></p><ul class="missed">${qz.missed.map(c=>`<li>${esc(c.a)}</li>`).join('')}</ul>`:'<p>Clean sweep.</p>'}
    <div class="row"><button class="btn primary" id="qagain">New round</button></div></div>`;return;}
  const c=qz.items[qz.i];
  z.innerHTML=`<div class="qcard"><div class="qhead"><span>Question ${qz.i+1} of ${qz.items.length}</span><span>Score ${qz.score}</span></div>
    <div class="q">${esc(c.q)}</div><div class="fig">${frontFig(c)}</div>
    <div class="opts">${optionsFor(c).map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="qfb"></div></div>`;
}
$('#v-quiz').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.qdeck){startQuiz(t.dataset.qdeck);return;}
  if(t.id==='qagain'){startQuiz(qz.deck);return;}
  if(t.id==='qnext'){qz.i++;drawQ();window.scrollTo({top:0});return;}
  if(t.classList.contains('opt')&&!qz.answered){
    qz.answered=true;const c=qz.items[qz.i];const ok=t.dataset.opt===c.a;
    if(ok)qz.score++;else qz.missed.push(c);
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.opt===c.a)b.classList.add('right');});
    if(!ok)t.classList.add('wrong');
    $('#qfb').innerHTML=`<p class="explain"><b>${ok?'Right.':'It’s: '+esc(c.a)+'.'}</b> ${esc(c.d||'')}</p><button class="btn primary" id="qnext" style="width:100%;margin-top:10px">${qz.i+1<qz.items.length?'Next':'See score'}</button>`;
  }
});

$('#v-pins').innerHTML=`
<div class="gsec"><h2>Plus, minus and ground</h2><p>Most schematics never draw the battery. Instead, labels tell you where power is.</p>
 <div class="figs">${fig(sym('rail'),'+9V: positive')}${fig(sym('vref'),'VREF: about 4.5V')}${fig(sym('ground'),'Ground: 0V, negative')}${fig(sym('battery',1),'Battery plates')}</div>
 <ul><li><b>Ground</b> is 0V. Every ground symbol connects to every other one and to the negative side of the supply.</li>
 <li><b>+9V, VCC, V+</b> all mean the positive supply. Some pedals also have <b>−9V</b> or <b>18V</b> from a charge pump.</li>
 <li><b>VREF</b> (also VB or 4.5V) sits halfway. Op-amp pedals swing the signal around it.</li>
 <li>Rule of thumb: on most pedal schematics, positive is drawn near the top and ground near the bottom.</li></ul></div>

<div class="gsec"><h2>Diodes and LEDs</h2><p>Anode is +, cathode is −. Current flows anode to cathode, the way the triangle points.</p>
 <div class="figs">${fig(sym('diode',1),'Symbol: bar = cathode')}${fig(diodeReal(1),'Real part: band = cathode')}${fig(ledReal(1),'LED: long leg = +')}</div>
 <ul><li>Memory trick: the bar looks like a minus sign standing up.</li>
 <li>Clipping diodes often come in pairs pointing opposite ways, so both halves of the wave get clipped.</li>
 <li>A polarity-protection diode points from the DC jack toward the circuit.</li></ul></div>

<div class="gsec"><h2>Capacitors</h2><p>Only some capacitors care which way round they go.</p>
 <div class="figs">${fig(sym('ecap',1),'Symbol: curved plate = −')}${fig(ecapReal(1),'Real part: stripe = −')}${fig(sym('cap'),'Flat plates: no polarity')}</div>
 <ul><li>Electrolytics (usually 1µF and up) are polarized. The + side goes toward the higher voltage.</li>
 <li>Film and ceramic caps (pF and nF values) can go in either way.</li></ul></div>

<div class="gsec"><h2>Transistor legs</h2><p>The arrow is always on the emitter (BJT) or the gate (JFET). The symbol tells you the leg names; the datasheet tells you which physical leg is which.</p>
 <div class="figs">${fig(sym('npn',1),'NPN: arrow out')}${fig(sym('pnp',1),'PNP: arrow in')}${fig(sym('njfet',1),'N-JFET: gate arrow in')}${fig(sym('nmos',1),'MOSFET: gate not touching')}</div>
 <ul><li><b>B</b> base: the flat bar. <b>C</b> collector and <b>E</b> emitter: the angled legs. Memory tricks: NPN = Not Pointing iN; PNP = Pointing iN Proudly.</li>
 <li>NPN: collector toward +9V, emitter toward ground. PNP: the reverse.</li>
 <li>JFET: <b>G</b> gate, <b>D</b> drain (toward +9V), <b>S</b> source. MOSFET: same names; the source has the arrow tied to it.</li></ul>
 <p style="margin:12px 0 4px;color:var(--muted)">On the real part, the leg order changes from one part number to the next, even when the package looks the same.</p>
 <div class="figs">${fig(to92('PART',['?','?','?']),'Leg order: check the datasheet')}</div>
 <ul><li>Search "[part number] datasheet" and look for the pinout drawing. Small regulators (78L05, 78L09) vary the same way.</li></ul></div>

<div class="gsec"><h2>Chips (8-pin)</h2><p>Find the notch or dot. That end is the top, and pin 1 is just left of it.</p>
 <div class="figs">${fig(dip8(1),'Dual op amp pinout (TL072, 4558, 5532)')}</div>
 <ul><li>Count down the left side 1 to 4, then up the right side 5 to 8.</li>
 <li>Schematics often draw a dual op amp as two triangles, <b>U1A</b> and <b>U1B</b>, plus a separate box for the power pins 8 and 4.</li></ul></div>

<div class="gsec"><h2>Pots</h2><p>Three lugs. The middle one is the wiper, the arrow in the symbol.</p>
 <div class="figs">${fig(sym('pot',1),'Symbol: arrow = lug 2')}${fig(potReal(1),'Shaft toward you, lugs down')}</div>
 <ul><li>Turning clockwise moves the wiper toward lug 3.</li>
 <li>Volume knob: lug 3 to the signal, lug 2 to the output, lug 1 to ground.</li>
 <li>Taper letter: <b>A</b> audio (log), <b>B</b> linear, <b>C</b> reverse log.</li></ul></div>

<div class="gsec"><h2>Jacks and power</h2>
 <div class="figs">${fig(plug,'Guitar plug')}${fig(sym('stereo',1),'Stereo input jack')}${fig(sym('dc',1),'DC jack: center negative')}</div>
 <ul><li>Tip = signal, sleeve = ground.</li>
 <li>A stereo input jack uses its ring to connect the battery’s negative to ground only when a cable is plugged in. That’s why you unplug pedals to save the battery.</li>
 <li>Pedal DC jacks are center negative. A center-positive adapter is what the protection diode guards against.</li></ul></div>`;

/* ---------- tabs ---------- */
const TABS=['cards','quiz','find','pins'];
function show(tab){
  if(!TABS.includes(tab))tab='cards';
  TABS.forEach(t=>{$('#v-'+t).classList.toggle('on',t===tab);});
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.tab;try{history.replaceState(null,'','#'+t);}catch(e){location.hash=t;}show(t);window.scrollTo({top:0});
}));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

function start(){
  startDeck('symbols');startQuiz('symbols');setMode('hunt');show(location.hash.slice(1)||'cards');
}
start();
})();
/* offline support: save the app on the phone after the first visit */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
</html>
